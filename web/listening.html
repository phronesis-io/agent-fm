<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>听画手记 · Agent FM</title>
    <link href="/listening.css" rel="stylesheet" />
  </head>
  <body>
    <header>
      <a href="/" aria-label="回到 Agent FM">← 回到房间</a>
      <div>
        <select id="lang" aria-label="Language">
          <option value="auto">◎ Auto</option>
          <option value="zh-CN">简体中文</option>
          <option value="zh-TW">繁體中文</option>
          <option value="en">English</option>
          <option value="ko">한국어</option>
          <option value="ja">日本語</option>
          <option value="fr">Français</option>
          <option value="es">Español</option>
          <option value="ar">العربية</option>
        </select>
      </div>
    </header>
    <nav id="index" aria-label="10"></nav>
    <main>
      <section>
        <a id="picture" target="_blank" rel="noreferrer"
          ><img id="art" alt=""
        /></a>
        <h2 id="track"></h2>
        <small id="credit"></small
        ><audio id="audio" controls preload="none"></audio
        ><a id="audio-source" target="_blank" rel="noreferrer"></a>
        <a id="license" target="_blank" rel="noreferrer"></a>
      </section>
      <article>
        <small id="original-label"></small>
        <p id="original" dir="auto"></p>
        <h1 id="title"></h1>
        <small id="where" dir="auto"></small>
        <p id="fact"></p>
        <a id="source" target="_blank" rel="noreferrer"></a>
        <div id="status" role="status"></div>
        <details id="explore" hidden>
          <summary id="explore-label"></summary>
          <div>
            <label id="voice-label" for="voice"></label
            ><textarea id="voice" rows="3" maxlength="1000"></textarea
            ><button id="chat"></button>
          </div>
        </details>
      </article>
    </main>
    <script type="module" src="/listening.js"></script>
  </body>
</html>
